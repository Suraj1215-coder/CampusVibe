<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusVibe — College Club Events Hub</title>
    <meta name="description" content="Discover, register, and manage college club events with CampusVibe.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ===== NAVBAR ===== -->
    <nav id="navbar">
        <div class="nav-container">
            <a href="#/" class="logo">
                <div class="logo-badge">⚡</div>
                <span class="logo-text">Campus<span class="logo-highlight">Vibe</span></span>
            </a>
            <div class="nav-links" id="navLinks">
                <a href="#/" class="nav-link" data-page="home">Home</a>
                <a href="#/events" class="nav-link" data-page="events">Events</a>
                <a href="#/my-registrations" class="nav-link my-regs-link" data-page="my-registrations">
                    <span class="nav-icon">🎟️</span> My Registrations <span class="badge-count" id="userRegBadge">0</span>
                </a>
                <a href="#/admin" class="nav-link admin-link" data-page="admin">
                    <span class="nav-icon">🔐</span> Admin
                </a>
            </div>
            <button class="hamburger" id="hamburger" aria-label="Toggle menu">
                <span></span><span></span><span></span>
            </button>
        </div>
    </nav>

    <!-- ===== MAIN APP ===== -->
    <main id="app"></main>

    <!-- ===== MODAL ===== -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" id="modal"></div>
    </div>

    <!-- ===== TOASTS ===== -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- ===== FOOTER ===== -->
    <footer id="footer">
        <div class="footer-content">
            <div class="footer-brand">
                <div class="logo" style="justify-content: center; margin-bottom: 12px;">
                    <div class="logo-badge">⚡</div>
                    <span class="logo-text">Campus<span class="logo-highlight">Vibe</span></span>
                </div>
                <p class="footer-tagline">Connecting Campus Communities & Unforgettable Events</p>
            </div>
            <div class="footer-links">
                <a href="#/">Home</a>
                <a href="#/events">Events</a>
                <a href="#/my-registrations">My Registrations</a>
                <a href="#/admin">Admin Portal</a>
            </div>
            <p class="footer-copy">&copy; 2026 CampusVibe Inc. All rights reserved. Crafted for College Clubs.</p>
        </div>
    </footer>

    <script src="app.js"></script>
</body>
</html>
